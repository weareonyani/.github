name: Project sync

on:
  workflow_call:
    inputs:
      area:
        description: Value for the board's Area field
        type: string
        required: false
      project-number:
        type: number
        default: 1
    secrets:
      PROJECT_TOKEN:
        required: true

jobs:
  sync:
    runs-on: [self-hosted, reckot]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: weareonyani/.github
          path: .org-github
          sparse-checkout: scripts
      - uses: actions/github-script@v8
        env:
          AREA: ${{ inputs.area }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const sync = require(`${process.env.GITHUB_WORKSPACE}/.org-github/scripts/project-sync.js`);
            await sync.run({
              github, context, core,
              org: context.repo.owner,
              projectNumber: ${{ inputs.project-number }},
              area: process.env.AREA,
            });
